name: Publish Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package version v$version"
          }

      - run: npm ci
      - run: npm run check
      - run: npm run web:build
      - run: npm run dist

      - name: Package web build and checksums
        shell: pwsh
        run: |
          Compress-Archive -Path web-dist\* -DestinationPath dist\PoE-Allflame-Voyage-Helper-Web-Static.zip -Force
          $files = @(
            "dist\PoE-Allflame-Voyage-Helper.exe",
            "dist\PoE-Allflame-Voyage-Helper-Web-Static.zip"
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLower()
            "$hash *$([IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content -Encoding ascii dist\SHA256SUMS.txt

      - name: Publish immutable GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/PoE-Allflame-Voyage-Helper.exe
            dist/PoE-Allflame-Voyage-Helper-Web-Static.zip
            dist/SHA256SUMS.txt
